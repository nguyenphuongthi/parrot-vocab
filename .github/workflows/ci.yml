name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kiểm tra dữ liệu bài học của mọi ngôn ngữ (lỗi định dạng thì dừng) và public/data đã được build lại
      - run: npm run data:en && npm run data:zh && npm run data:ko && npm run data:ja
      - run: git diff --exit-code -- public/data
      - run: npm run build
      # Test đơn vị + test trình duyệt (Chrome có sẵn trên runner ubuntu)
      - run: npm test
        env:
          CI: '1'
