<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Bản tràn nền cho PWA (Android cắt theo hình tròn / bo góc) và apple-touch-icon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDEBA6"/>
      <stop offset="0.5" stop-color="#8DC97C"/>
      <stop offset="1" stop-color="#46976A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5FA06C"/>
      <stop offset="1" stop-color="#9ED07F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2E6B4A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Thu nhỏ hình vào vùng an toàn (~80% giữa) -->
  <g transform="translate(64 64) scale(0.86) translate(-62 -62)">
    <g filter="url(#soft)">
      <line x1="77" y1="77" x2="97" y2="97" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
      <circle cx="57" cy="57" r="29" fill="#FFFFFF"/>
    </g>
    <circle cx="57" cy="57" r="20.5" fill="#F3FAEC"/>
    <path d="M43 71 C42 55 52 44 71 43 C72 61 61 71 43 71 Z" fill="url(#leaf)"/>
    <path d="M46 68 Q55 58 66 48" fill="none" stroke="#F3FAEC" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M100 26 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6 z" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
